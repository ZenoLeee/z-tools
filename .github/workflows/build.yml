name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test platform detection
      run: |
        python -c "from utils.platform import *; print('Platform:', get_platform_name()); print('Supported features:', get_supported_features())"

    - name: Test imports
      run: |
        python -c "from core.shortcut_scanner import *; print('Shortcut scanner: OK')"
        python -c "from core.platform import get_shortcut_scanner; print('Platform adapter: OK')"

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --windowed --name z-tools_test main.py

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-windows
        path: dist/z-tools_test.exe

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Test platform detection
      run: |
        python3 -c "from utils.platform import *; print('Platform:', get_platform_name()); print('Supported features:', get_supported_features())"

    - name: Test imports
      run: |
        python3 -c "from core.shortcut_scanner import *; print('Shortcut scanner: OK')"
        python3 -c "from core.platform import get_shortcut_scanner; print('Platform adapter: OK')"
        python3 -c "from core.platform.macos.shortcut_scanner import MacShortcutScanner; print('Mac shortcut scanner: OK')"
        python3 -c "from core.platform.macos.startup_manager import MacStartupManager; print('Mac startup manager: OK')"

    - name: Test Mac-specific features
      run: |
        python3 -c "
        from utils.platform import is_macos
        from core.platform import get_shortcut_scanner, get_registry_cleaner
        assert is_macos(), 'Should be macOS'
        scanner = get_shortcut_scanner()
        assert scanner is not None, 'Should have shortcut scanner'
        registry = get_registry_cleaner()
        assert registry is None, 'Should not have registry on macOS'
        print('Mac platform tests: PASSED')
        "

    - name: Build with PyInstaller
      run: |
        python3 -m PyInstaller --onefile --windowed --name z-tools_test main.py

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-macos
        path: dist/z-tools_test

  test-cross-platform:
    name: Test Cross-Platform Features
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil

    - name: Test platform detection
      run: |
        python -c "
        from utils.platform import get_platform, get_platform_name, get_supported_features
        import sys
        print(f'Python: {sys.version}')
        print(f'Platform: {get_platform_name()}')
        print(f'Features: {get_supported_features()}')
        "

    - name: Test file scanner (cross-platform)
      run: |
        python -c "
        from core.file_scanner import FileScanner
        scanner = FileScanner()
        print('File scanner: OK')
        "

    - name: Test network tools (cross-platform)
      run: |
        python -c "
        from core.network_tools import NetworkTools
        tools = NetworkTools()
        print('Network tools: OK')
        "

  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: z-tools-windows
        path: artifacts

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: z-tools-macos
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/z-tools_test.exe
          artifacts/z-tools_test
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
