name: Build and Test

on:
  push:
    tags:
      - 'v*'  # 推送 v* 开头的 tag 时触发
  workflow_dispatch:  # 同时也支持手动触发

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test platform detection
      run: |
        python -c "from utils.platform import *; print('Platform:', get_platform_name()); print('Supported features:', get_supported_features())"

    - name: Test imports
      run: |
        python -c "from core.shortcut_scanner import *; print('Shortcut scanner: OK')"
        python -c "from core.platform import get_shortcut_scanner; print('Platform adapter: OK')"

    - name: Get version
      id: version
      run: |
        $VERSION = Select-String -Path "core\version_manager.py" -Pattern "CURRENT_VERSION = " | Select-Object -First 1 | ForEach-Object { $_.ToString() -replace '.*"(.*)".*', '$1' }
        echo "VERSION=$VERSION" | Out-File -Encoding ASCII $env:GITHUB_ENV
        echo "VERSION=$VERSION"
      shell: pwsh

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --windowed --name z-tools_v${{ env.VERSION }} main.py

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-windows
        path: dist/z-tools_v${{ env.VERSION }}.exe

  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Test platform detection
      run: |
        python3 -c "from utils.platform import *; print('Platform:', get_platform_name()); print('Supported features:', get_supported_features())"

    - name: Test imports
      run: |
        python3 -c "from core.shortcut_scanner import *; print('Shortcut scanner: OK')"
        python3 -c "from core.platform import get_shortcut_scanner; print('Platform adapter: OK')"
        python3 -c "from core.platform.macos.shortcut_scanner import MacShortcutScanner; print('Mac shortcut scanner: OK')"
        python3 -c "from core.platform.macos.startup_manager import MacStartupManager; print('Mac startup manager: OK')"

    - name: Test Mac-specific features
      run: |
        python3 -c "
        from utils.platform import is_macos
        from core.platform import get_shortcut_scanner, get_registry_cleaner
        assert is_macos(), 'Should be macOS'
        scanner = get_shortcut_scanner()
        assert scanner is not None, 'Should have shortcut scanner'
        registry = get_registry_cleaner()
        assert registry is None, 'Should not have registry on macOS'
        print('Mac platform tests: PASSED')
        "

    - name: Get version
      id: version
      run: |
        VERSION=$(grep "CURRENT_VERSION = " core/version_manager.py | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION"

    - name: Build with PyInstaller
      run: |
        python3 -m PyInstaller --onefile --windowed --name z-tools_v${{ env.VERSION }} main.py

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-macos
        path: dist/z-tools_v${{ env.VERSION }}
