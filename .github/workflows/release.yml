name: Build Release Packages

on:
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号（留空自动获取）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'  # 当推送 tag 时自动触发

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get version
      id: get_version
      run: |
        if ("%VERSION%"=="") {
          $VERSION = python -c "import sys; sys.path.insert(0, 'core'); from version_manager import VersionManager; print(VersionManager.CURRENT_VERSION)"
        } else {
          $VERSION = "%VERSION%"
        }
        echo "VERSION=$VERSION" | Out-File -Encoding ASCII $env:GITHUB_ENV
        echo "VERSION=$VERSION"
      shell: pwsh
      env:
        VERSION: ${{ github.event.inputs.version }}

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --onefile --windowed --name z-tools_v${{ env.VERSION }} main.py

    - name: Create release package
      run: |
        mkdir release
        cp dist/z-tools_v${{ env.VERSION }}.exe release/
        cp README.md release/
        echo "Created Windows package"

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-windows-${{ env.VERSION }}
        path: release/
        retention-days: 30

  build-macos:
    name: Build macOS Package
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Get version
      id: get_version
      run: |
        if [ -z "${{ github.event.inputs.version }}" ]; then
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'core'); from version_manager import VersionManager; print(VersionManager.CURRENT_VERSION)")
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION"

    - name: Build with PyInstaller
      run: |
        python3 -m PyInstaller --onefile --windowed --name z-tools_v${{ env.VERSION }} main.py

    - name: Create macOS app bundle (optional)
      run: |
        # 创建简单的 app 包结构
        mkdir -p z-tools.app/Contents/MacOS
        mkdir -p z-tools.app/Contents/Resources

        # 复制可执行文件
        cp dist/z-tools_v${{ env.VERSION }} z-tools.app/Contents/MacOS/

        # 创建 Info.plist
        cat > z-tools.app/Contents/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>z-tools_v${{ env.VERSION }}</string>
            <key>CFBundleIdentifier</key>
            <string>com.ztools.toolbox</string>
            <key>CFBundleName</key>
            <string>z-tools</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ env.VERSION }}</string>
            <key>CFBundleVersion</key>
            <string>${{ env.VERSION }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.14</string>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        EOF

        # 创建 Unix 可执行文件（无扩展名）
        cp dist/z-tools_v${{ env.VERSION }} z-tools-macos
        chmod +x z-tools-macos
        chmod +x z-tools.app/Contents/MacOS/z-tools_v${{ env.VERSION }}

    - name: Create release package
      run: |
        mkdir release
        cp z-tools-macos release/
        cp -r z-tools.app release/
        cp README.md release/
        echo "Created macOS package"

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: z-tools-macos-${{ env.VERSION }}
        path: release/
        retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: z-tools-windows-${{ github.ref_name }}
        path: windows-release

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: z-tools-macos-${{ github.ref_name }}
        path: macos-release

    - name: Create release archives
      run: |
        cd windows-release
        zip -r ../z-tools-windows.zip *
        cd ../macos-release
        zip -r ../z-tools-macos.zip *

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          z-tools-windows.zip
          z-tools-macos.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
